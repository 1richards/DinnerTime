appId: com.dinnertime.app
name: "10 — meal plan: swap a day's recipe via the SwapSheet"
# Pre-condition: a meal plan must already exist. Run 09-meal-plan-generate first.
#
# Phase 15 update: SwapSheet close chevron + swap/flame day-row icons migrated
# from Ionicons to SF Symbols (arrow.left.arrow.right, flame, xmark).
# swap-btn-<Day> testIDs preserved. Text selectors (Swap this meal, Pick
# something else, This Week) unchanged.
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Plan tab
- tapOn:
    text: ".*Plan.*"

- extendedWaitUntil:
    visible:
      text: ".*This Week.*"

    timeout: 90000
- takeScreenshot: 03-plan-loaded

# DayRow renders swap and cook icon buttons. Both have testID props:
# swap-btn-Mon, cook-btn-Mon, etc. Use testID (id selector) for reliable targeting.
- tapOn:
    id: "swap-btn-Mon"
- takeScreenshot: 04-swap-sheet-open

# SwapSheet (SwapSheet.tsx) renders:
#   "Swap this meal?" — sheet title
#   "Pick something else" — confirm button
#   "Cancel" — cancel button
- extendedWaitUntil:
    visible:
      text: ".*Swap this meal.*"

    timeout: 10000
- takeScreenshot: 05-swap-sheet-visible

# Confirm the swap — button title is "Pick something else" (AI-backed — generous timeout)
- tapOn:
    text: ".*Pick something else.*"

- takeScreenshot: 06-swapping

- extendedWaitUntil:
    visible:
      text: ".*This Week.*"

    timeout: 60000
- takeScreenshot: 07-swap-complete
