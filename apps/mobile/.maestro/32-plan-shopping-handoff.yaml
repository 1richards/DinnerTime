appId: com.dinnertime.app
name: "32 — Plan tab → Shopping handoff via HandoffSheet"
tags:
  - phase-22
# Implements PLAN-X-03 (22-01 / Cluster 1 — Cross-flow nav).
#
# A parallel entry point to shopping.tsx: the Plan tab exposes a
# "Shopping list for week" action button that runs the same generateList →
# createOrder → HandoffSheet pipeline Phase 20 established. shopping.tsx
# remains the canonical copy; this is a second mount site, not a rewrite.
#
# Expected screenshot progression:
#   01-plan-loaded      — Plan tab with "This Week" header visible
#   02-handoff-sheet    — HandoffSheet state (sending or success/error).
#                         Either path is acceptable for this stub; human
#                         review verifies the sheet appears.
---
- runFlow: _ensure-logged-in.yaml
- tapOn: "Plan"
- extendedWaitUntil:
    visible:
      text: ".*This Week.*"
    timeout: 15000
- takeScreenshot: 01-plan-loaded
- tapOn: "Shopping list for week"
- takeScreenshot: 02-handoff-sheet
