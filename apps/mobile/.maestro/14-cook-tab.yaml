appId: com.dinnertime.app
name: "14 — cook tab: open Cook tab, navigate to a recipe from it"
# The Cook tab (cook.tsx) is a landing page that directs users to pick a recipe.
# It renders "Hands-Free Cooking" and an "Open Recipes" button.
# The actual voice-guided cooking mode (recipes/[id]/cook.tsx) requires VOICE
# and is tested only up to the point of pressing "Start Cooking" — we do NOT
# enter the voice screen itself (see 15-cook-mode-stub.yaml).
---
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true
- extendedWaitUntil:
    visible:
      text: "DinnerTime"
    timeout: 60000
- takeScreenshot: 01-app-loaded

# Login
- extendedWaitUntil:
    visible:
      text: "Sign In"
    timeout: 10000
- tapOn:
    text: "you@example.com"
- inputText: "uat@dinnertime.test"
- tapOn:
    text: "Your password"
- inputText: "UAT-overnight-2026!"
- tapOn:
    text: "Sign In"
- extendedWaitUntil:
    visible:
      text: "What should we cook tonight"
    timeout: 30000
- takeScreenshot: 02-home

# Cook tab
- tapOn:
    text: "Cook"
- takeScreenshot: 03-cook-tab
- extendedWaitUntil:
    visible:
      text: "Hands-Free Cooking"
    timeout: 10000
- assertVisible:
    text: "Start Cooking"
    optional: true
- assertVisible:
    text: "Open Recipes"
- takeScreenshot: 04-cook-tab-content

# Tap "Open Recipes" — navigates to (tabs)/recipes
- tapOn:
    text: "Open Recipes"
- extendedWaitUntil:
    visible:
      text: "My Recipes"
    timeout: 10000
- takeScreenshot: 05-on-recipes-tab

# If at least one recipe exists, open the detail screen and verify "Start Cooking" button
- tapOn:
    point: "50%,35%"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Start Cooking"
    timeout: 10000
    optional: true
- takeScreenshot: 06-recipe-detail-with-start-cooking
