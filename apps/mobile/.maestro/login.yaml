appId: com.dinnertime.app
name: login — existing user signs in and lands on home
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
---
- launchApp:
    clearState: true
- assertVisible:
    text: "loading=false"
- takeScreenshot: 01-login-screen
- tapOn:
    id: "email-input"
    optional: true
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Sign In"
- assertVisible:
    text: "loggedIn=true"
- takeScreenshot: 02-logged-in
# Either onboarding or tabs depending on user state.
- assertVisible:
    text: "onboarded=true"
    optional: true
- takeScreenshot: 03-final
