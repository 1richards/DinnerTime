appId: com.dinnertime.app
name: "11 — shopping list: generate from meal plan, add manual item, check items off"
# Pre-condition: a meal plan must exist. Run 09-meal-plan-generate first.
#
# Phase 15 update: add-item FAB glyph swapped from Ionicons add to SF Symbol
# plus (orange container #F97316, tint #FFFFFF preserved). Empty shopping list
# now uses EmptyState primitive with SF Symbol cart. FAB coordinate tap
# 88%,78% unchanged. Text selectors (Generate from Meal Plan, Order on
# Instacart, Add item, e.g. Oranges) all stable.
---
# Force a clean app restart to avoid stale modal state from previous flows.
- launchApp:
    clearState: true
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: ".*Open.*"
    optional: true
- tapOn:
    text: ".*Continue.*"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true

- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Visit Plan tab first so fetchCurrentPlan() has time to load the server-side
# meal plan into Zustand. Without this, the Shopping tab renders the empty state
# with the "Generate from Meal Plan" button disabled (no plan in store yet).
- tapOn:
    text: ".*Plan.*"
- extendedWaitUntil:
    visible:
      text: ".*This Week.*"
    timeout: 30000
- takeScreenshot: 02b-plan-confirmed

# Shopping tab
- tapOn:
    text: ".*Shopping.*"

- takeScreenshot: 03-shopping-tab

# Wait for shopping tab to load AND for mealPlanStore to populate currentPlan.
# The "Create a meal plan in the Plan tab first" hint disappears once
# fetchCurrentPlan() resolves with a valid plan — gives us a reliable wait target.
# Either the shopping list is already populated (skip empty state) OR we wait
# for the generate button to become enabled.
- extendedWaitUntil:
    notVisible:
      text: ".*Create a meal plan in the Plan tab first.*"
    timeout: 15000
- takeScreenshot: 04-shopping-state

# If empty, generate from meal plan (AI-backed)
- tapOn:
    text: ".*Generate from Meal Plan.*"

    optional: true
- takeScreenshot: 05-generating
- extendedWaitUntil:
    visible:
      text: ".*Order on Instacart.*"

    timeout: 90000
- takeScreenshot: 06-list-loaded

# Shopping list should show at least a title and the "Orders" button
- assertVisible:
    text: ".*Orders.*"

    optional: true
- takeScreenshot: 07-list-visible

# Add a manual item via the + FAB (AddItemSheet)
# FAB is at right-5 bottom-24; computed ~88% X, 78% Y for iPhone 17 Pro
- tapOn:
    point: "88%,78%"
- takeScreenshot: 08-add-item-sheet

# Wait for the sheet to appear
- extendedWaitUntil:
    visible:
      text: ".*Add item.*"

    timeout: 10000
- takeScreenshot: 09-sheet-open

# Tap the placeholder text to explicitly focus the TextInput before inputText.
# Without this explicit focus tap, onChangeText is not triggered reliably
# in React Native's New Architecture (Fabric) and the name state stays empty,
# leaving the "Add to list" button disabled.
- tapOn:
    text: ".*e.g. Oranges.*"
- inputText: "UAT Test Item"
- takeScreenshot: 10-item-name-entered

# Submit via Return key — TextInput has returnKeyType="done" + onSubmitEditing=handleSubmit
- pressKey: enter

- takeScreenshot: 11-item-added

# Verify sheet dismissed and we're back on the list
- extendedWaitUntil:
    visible:
      text: ".*Order on Instacart.*"

    timeout: 10000
- takeScreenshot: 12-back-on-list
