appId: com.dinnertime.app
name: "11 — shopping list: generate from meal plan, add manual item, check items off"
# Pre-condition: a meal plan must exist. Run 09-meal-plan-generate first.
---
# Force a clean app restart to avoid stale modal state from previous flows.
- launchApp:
    clearState: true
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: ".*Open.*"
    optional: true
- tapOn:
    text: ".*Continue.*"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true

- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Shopping tab
- tapOn:
    text: ".*Shopping.*"

- takeScreenshot: 03-shopping-tab

# Wait for the shopping tab to finish loading (empty or populated).
# Both states show "shopping" context — wait for a stable element.
- takeScreenshot: 04-shopping-state

# If empty, generate from meal plan (AI-backed)
- tapOn:
    text: ".*Generate from Meal Plan.*"

    optional: true
- takeScreenshot: 05-generating
- extendedWaitUntil:
    visible:
      text: ".*Order on Instacart.*"

    timeout: 90000
- takeScreenshot: 06-list-loaded

# Shopping list should show at least a title and the "Orders" button
- assertVisible:
    text: ".*Orders.*"

    optional: true
- takeScreenshot: 07-list-visible

# Add a manual item via the + FAB (AddItemSheet)
# FAB is at right-5 bottom-24; computed ~88% X, 78% Y for iPhone 17 Pro
- tapOn:
    point: "88%,78%"
- takeScreenshot: 08-add-item-sheet

# Wait for the sheet to appear
- extendedWaitUntil:
    visible:
      text: ".*Add item.*"

    timeout: 10000
- takeScreenshot: 09-sheet-open

# Tap the placeholder text to explicitly focus the TextInput before inputText.
# Without this explicit focus tap, onChangeText is not triggered reliably
# in React Native's New Architecture (Fabric) and the name state stays empty,
# leaving the "Add to list" button disabled.
- tapOn:
    text: ".*e.g. Oranges.*"
- inputText: "UAT Test Item"
- takeScreenshot: 10-item-name-entered

# Submit via Return key — TextInput has returnKeyType="done" + onSubmitEditing=handleSubmit
- pressKey: enter

- takeScreenshot: 11-item-added

# Verify sheet dismissed and we're back on the list
- extendedWaitUntil:
    visible:
      text: ".*Order on Instacart.*"

    timeout: 10000
- takeScreenshot: 12-back-on-list
