appId: com.dinnertime.app
name: "03 — recipe import: paste URL, wait for AI parse, review and save"
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Go to Recipes tab
- tapOn:
    text: ".*Recipes.*"

- takeScreenshot: 03-recipes-tab

# Tap the floating + button (ImportFab) to open import method picker
- tapOn:
    point: "90%,88%"
- takeScreenshot: 04-import-method-screen
- assertVisible:
    text: ".*Paste URL.*"


# Select URL import
- tapOn:
    text: ".*Paste URL.*"

- takeScreenshot: 05-import-url-screen
- assertVisible:
    text: ".*Recipe URL.*"


# Enter a recipe URL (simplyrecipes allows server-side fetches)
- tapOn:
    text: ".*https://example.com/recipe.*"

- inputText: "https://www.budgetbytes.com/scrambled-eggs/"
- takeScreenshot: 06-url-entered

# Trigger import — use exact match "Import" to avoid matching "< Import Recipe" breadcrumb
- tapOn:
    text: "Import"

- takeScreenshot: 07-importing
- extendedWaitUntil:
    visible:
      text: ".*Save Recipe.*"

    timeout: 90000
- takeScreenshot: 08-review-screen

# Review screen should show a title field
- assertVisible:
    text: ".*Recipe title.*"

    optional: true

# Save the recipe
- tapOn:
    text: "Save Recipe"

- takeScreenshot: 09-saving

# Should navigate back to Recipes tab (or show "My Recipes" heading)
- extendedWaitUntil:
    visible:
      text: ".*My Recipes.*"

    timeout: 20000
- takeScreenshot: 10-saved-to-library
