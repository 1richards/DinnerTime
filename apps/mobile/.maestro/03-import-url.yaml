appId: com.dinnertime.app
name: "03 — recipe import: paste URL, wait for AI parse, review and save"
# Phase 15 update: recipes/import and recipes/import-url now present as modals
# with a native header (headerBackTitle: '' / HeaderCloseButton X on import
# root). Text selectors used here (Paste URL, Recipe URL, Import, Save Recipe,
# View Existing, in your library) remain stable — the native header title is
# "Paste URL" on import-url, "Import Recipe" on import root. No "Back" text
# assertions — pop gesture is native chevron. Screenshots will capture new
# SymbolIcon-based UI; existing baselines accepted (icon-swap-only diff).
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Go to Kitchen tab → Recipe Box segment (renamed from "Library" post-phase-21)
- tapOn:
    text: ".*Kitchen.*"
- tapOn:
    text: ".*Recipe Box.*"

- takeScreenshot: 03-recipes-tab

# Open import method picker via FAB.
# FAB is at bottom-right (right-24, bottom-24); 94%,85% lands on it on iPhone 17 Pro.
- tapOn:
    point: "94%,85%"
- extendedWaitUntil:
    visible:
      text: ".*Paste URL.*"
    timeout: 10000
- takeScreenshot: 04-import-method-screen
- assertVisible:
    text: ".*Paste URL.*"


# Select URL import
- tapOn:
    text: ".*Paste URL.*"

- takeScreenshot: 05-import-url-screen
- assertVisible:
    text: ".*Recipe URL.*"


# Enter a recipe URL (budgetbytes allows server-side fetches)
- tapOn:
    text: ".*https://example.com/recipe.*"

- inputText: "https://www.budgetbytes.com/scrambled-eggs/"
- takeScreenshot: 06-url-entered

# Trigger import — use exact match "Import" to avoid matching "< Import Recipe" breadcrumb
- tapOn:
    text: "Import"

- takeScreenshot: 07-importing

# Wait for either the AI review screen ("Save Recipe") or the duplicate detection screen
# ("View Existing"). One of these will appear; 90s covers the AI parse latency.
- extendedWaitUntil:
    visible:
      text: ".*Save Recipe.*|.*View Existing.*"
    timeout: 90000
- takeScreenshot: 08-review-or-duplicate

# Re-run path: duplicate detected → tap "View Existing" to go back to library.
- tapOn:
    text: ".*View Existing.*"
    optional: true
- takeScreenshot: 08b-view-existing

# Fresh-run path: review screen → save the recipe.
- tapOn:
    text: ".*Save Recipe.*"
    optional: true

- takeScreenshot: 09-saving

# Final assertion: confirm we are on (or returned to) the Kitchen Recipe Box segment.
- extendedWaitUntil:
    visible:
      text: ".*in your recipe box.*"
    timeout: 20000
- takeScreenshot: 10-saved-to-recipe-box
