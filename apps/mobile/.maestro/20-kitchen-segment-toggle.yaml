appId: com.dinnertime.app
name: "20 — kitchen: segment toggle + sticky search pill"
tags:
  - phase-19
# Proves the Phase 12 Kitchen tab + Phase 19 StickySearchPill:
#   (a) opens on Suggestions by default,
#   (b) switches to Library and shows the sticky "Search recipes" pill,
#   (c) tapping the pill opens the /search modal and back returns to Library
#       without z-order flash (Phase 19 Pitfall 4 mitigation),
#   (d) segment swap back to Suggestions preserves Library scroll/filter state
#       (display:none dual-mount behavior from Phase 12).
#
# Phase 19 Plan 05 rewrote the inline SearchBar into a sticky pill; the
# "Toggle search" action button is GONE. The pill's placeholder text +
# accessibilityLabel = "Search recipes". Taps route to /search?context=library.
#
# Phase 15 update: Kitchen tab icon swapped from Ionicons restaurant to SF
# fork.knife.circle.fill / fork.knife. Text-based .*Kitchen.* / .*Recipe Box.*
# tab selectors still resolve correctly.
---
# Force a clean app restart — upstream flows (19 bulk-import-sheet) can leave
# modals open that bleed into this flow's initial state.
- launchApp:
    clearState: true
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: ".*Open.*"
    optional: true
- tapOn:
    text: ".*Continue.*"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true

- runFlow: _ensure-logged-in.yaml

# 1. Verify default segment is Suggestions (hero + "What should we cook tonight")
- assertVisible:
    text: ".*What should we cook tonight.*"
- takeScreenshot: 20-01-suggestions-default

# 2. Switch to Library, verify the library stable marker visible
- tapOn:
    text: ".*Recipe Box.*"
- assertVisible:
    text: ".*in your recipe box.*"
- takeScreenshot: 20-02-library-active

# 3. Sticky search pill is visible above the large-title header.
#    Phase 19: placeholder "Search recipes" text is inside the pill itself.
- assertVisible:
    text: "Search recipes"
- takeScreenshot: 20-03-library-sticky-pill

# 4. Tap the pill -> /search modal opens with "Search" title.
- tapOn:
    text: "Search recipes"
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 10000
- takeScreenshot: 20-04-search-modal-open

# 5. Dismiss the modal via swipe-down (expo-router 55 modal presentation)
#    and verify we're back on Library without z-order flash.
- swipe:
    start: "50%,10%"
    end: "50%,90%"
- extendedWaitUntil:
    visible:
      text: ".*in your recipe box.*"
    timeout: 10000
- takeScreenshot: 20-05-back-on-library

# 6. Switch to Suggestions, verify hero/greeting visible (segment swap works).
- tapOn:
    text: ".*Suggestions.*"
- assertVisible:
    text: ".*What should we cook tonight.*"
- takeScreenshot: 20-06-back-to-suggestions

# 7. Switch back to Library, verify sticky pill still renders.
#    display:none dual-mount keeps both segments alive — the pill is a
#    Library-only affordance that re-renders when segment === 'library'.
- tapOn:
    text: ".*Recipe Box.*"
- assertVisible:
    text: "Search recipes"
- takeScreenshot: 20-07-library-state-preserved
