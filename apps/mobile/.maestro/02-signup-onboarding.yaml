appId: com.dinnertime.app
name: "02 — signup + onboarding: new user registers and completes 3-step wizard"
# NOTE: This flow creates a NEW account each run. Use a unique timestamp-based email
# via env var, or run the reset script first if you want to reuse a seed account.
# The flow is written to work with any fresh email.
#
# Run with: MAESTRO_NEW_EMAIL=newuser+<timestamp>@dinnertime.test maestro test ...
#
# If MAESTRO_NEW_EMAIL is not set the env substitution will produce a literal string
# which will cause a duplicate-email error on the second run — that is acceptable for
# a smoke-once scenario.
---
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true
- extendedWaitUntil:
    visible:
      text: "DinnerTime"
    timeout: 60000
- takeScreenshot: 01-app-loaded

# Expect login screen
- extendedWaitUntil:
    visible:
      text: "Sign In"
    timeout: 10000
- takeScreenshot: 02-login-screen

# Navigate to register
- tapOn:
    text: "Sign up"
- takeScreenshot: 03-register-screen
- assertVisible:
    text: "Join DinnerTime"

# Fill register form
- tapOn:
    text: "you@example.com"
- inputText: "${MAESTRO_NEW_EMAIL}"
- tapOn:
    text: "At least 8 characters"
- inputText: "TestPass123!"
- tapOn:
    text: "Enter password again"
- inputText: "TestPass123!"
- takeScreenshot: 04-register-filled

- tapOn:
    text: "Create Account"
- takeScreenshot: 05-creating-account

# Wait for onboarding Step 0 (Welcome to DinnerTime!)
- extendedWaitUntil:
    visible:
      text: "Welcome to DinnerTime"
    timeout: 30000
- takeScreenshot: 06-onboarding-step0

# Step 0: enter display name
- tapOn:
    text: "Your name"
- inputText: "UAT Tester"
- takeScreenshot: 07-name-filled

- tapOn:
    text: "Next"
- takeScreenshot: 08-onboarding-step1

# Step 1: Household — tap "2" (already default but tap to confirm)
- assertVisible:
    text: "Your Household"
- tapOn:
    text: "2"
- takeScreenshot: 09-household-selected

- tapOn:
    text: "Next"
- takeScreenshot: 10-onboarding-step2

# Step 2: Preferences — pick Italian cuisine
- assertVisible:
    text: "Your Preferences"
- tapOn:
    text: "Italian"
- takeScreenshot: 11-cuisine-selected

# Get Started
- tapOn:
    text: "Get Started"
- takeScreenshot: 12-saving

# Should land on home tab
- extendedWaitUntil:
    visible:
      text: "What should we cook tonight"
    timeout: 30000
- takeScreenshot: 13-home-reached
