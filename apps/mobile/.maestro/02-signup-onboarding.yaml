appId: com.dinnertime.app
name: "02 — register screen renders after sign-out"
# Verifies a fresh-state app boots to Sign In, the register form is reachable,
# and all its inputs + social buttons are present.
#
# KNOWN LIMITATIONS (documented in UAT-NIGHT-REPORT.md BUG-6):
# - Maestro/XCUITest cannot inject text into iOS secureTextEntry password fields
#   in the simulator. Removing secureTextEntry would be a security regression.
# - Supabase rejects @dinnertime.test domain + requires email confirmation, so
#   even if we could fill the password field, the signup call would fail.
# - Onboarding wizard testing is deferred — the fresh-account approach requires
#   a pre-created unconfirmed user, which conflicts with Supabase rate limits.
---
# Clear all persisted state so the app boots to the Sign In screen.
- launchApp:
    clearState: true
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: ".*Open.*"
    optional: true
- tapOn:
    text: ".*Continue.*"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*DinnerTime.*"
    timeout: 60000
- takeScreenshot: 01-app-loaded

# Expect login screen (no persisted session after clearState)
- extendedWaitUntil:
    visible:
      text: ".*Sign In.*"
    timeout: 10000
- takeScreenshot: 02-login-screen

# Navigate to register
- tapOn:
    text: ".*Sign up.*"
- takeScreenshot: 03-register-screen

# Verify all the register form pieces are present
- extendedWaitUntil:
    visible:
      text: ".*Join DinnerTime.*"
    timeout: 10000
- assertVisible:
    text: ".*Create Account.*"
- assertVisible:
    text: ".*Continue with Google.*"
- assertVisible:
    text: ".*Already have an account.*"
- takeScreenshot: 04-register-form-visible
