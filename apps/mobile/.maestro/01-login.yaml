appId: com.dinnertime.app
name: "01 — login: existing user signs in and lands on home"
# This flow validates that an existing user can reach the home tab. It uses
# the shared _ensure-logged-in helper which handles both the "session
# persisted" and "needs to log in" cases. The fill-and-tap sequence is
# exercised whenever the AsyncStorage session has been cleared.
#
# Why not launchApp clearState:true? — Maestro/XCUITest cannot inject text
# into iOS secureTextEntry fields in the simulator (see BUG-5/BUG-6 in
# UAT-NIGHT-REPORT.md). When we force-clear the Supabase session, the next
# password inputText is silently dropped, and the flow can't recover. Login
# screen rendering is covered by flow 02 which DOES clearState and asserts
# the form UI is present (without filling password).
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home-reached
- assertVisible:
    text: ".*UAT Tester.*"
- assertVisible:
    text: ".*What should we cook tonight.*"
