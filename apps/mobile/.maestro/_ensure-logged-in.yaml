appId: com.dinnertime.app
# Shared helper: boot the app into a logged-in state, regardless of whether
# a session was persisted. Called by most flows via `runFlow`.
---
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: ".*Open.*"
    optional: true
- tapOn:
    text: ".*Continue.*"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*DinnerTime.*"
    timeout: 60000

# If already logged in (session persisted from a prior run), skip. Otherwise
# the "Sign In" button is visible — fill the form.
- runFlow:
    when:
      visible:
        text: ".*Sign In.*"
    commands:
      - tapOn:
          text: ".*you@example.com.*"
      - inputText: "uat@dinnertime.test"
      - tapOn:
          text: ".*Your password.*"
      - inputText: "UATovernight2026"
      # Dismiss the keyboard by tapping the non-interactive hero title,
      # otherwise the Sign In button sits behind the keyboard and a tap
      # there would land on a keyboard key and type characters into the
      # password field. hideKeyboard is not supported by RN inputs here.
      - tapOn:
          text: "YOUR KITCHEN AWAITS"
      - tapOn:
          text: ".*Sign In.*"
      # iOS Save Password dialog pops asynchronously (1-5s) after Sign In
      # submit and overlays the whole app, blocking Maestro's view of the
      # Home screen. Poll-dismiss: check up to 5 times, each tap-optional
      # attempt gives iOS a ~5s window to show the dialog. If the dialog
      # never appears, each iteration is a cheap no-op.
      - repeat:
          times: 5
          commands:
            - tapOn:
                text: "Not Now|Never for This Website|Update"
                optional: true
      # Wait for the Kitchen home greeting subtitle — plain Text rendered
      # directly (no accessibilityLabel masking it from Maestro's AX tree,
      # which is what kept "Suggestions" (inside a Pressable with
      # accessibilityLabel="Suggestions segment") silently invisible).
      - extendedWaitUntil:
          visible:
            text: ".*What should we cook tonight.*"
          timeout: 60000
