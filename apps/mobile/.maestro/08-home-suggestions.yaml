appId: com.dinnertime.app
name: "08 — kitchen: suggestions segment renders after login"
# Verifies the Kitchen tab opens on the Suggestions segment (default) with
# greeting + "What should we cook tonight" hero after auth hydrates.
# Settings navigation is tested in flow 13 via deep link.
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home-loaded
- assertVisible:
    text: ".*UAT Tester.*"
- assertVisible:
    text: ".*What should we cook tonight.*"
- takeScreenshot: 03-home-header

# The empty-pantry state shows "Scan your fridge first" + "Go to Pantry" CTA.
- assertVisible:
    text: ".*Scan your fridge first.*"
    optional: true
- assertVisible:
    text: ".*Go to Pantry.*"
    optional: true
- takeScreenshot: 04-home-empty-state
