appId: com.dinnertime.app
name: "08 — home: landing page renders after login"
# Verifies the Home tab lands on the greeting + dinner dashboard after
# auth hydrates. Settings navigation is tested in flow 13 via deep link.
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home-loaded
- assertVisible:
    text: ".*UAT Tester.*"
- assertVisible:
    text: ".*What should we cook tonight.*"
- takeScreenshot: 03-home-header

# The empty-pantry state shows "Scan your fridge first" + "Go to Pantry" CTA.
- assertVisible:
    text: ".*Scan your fridge first.*"
    optional: true
- assertVisible:
    text: ".*Go to Pantry.*"
    optional: true
- takeScreenshot: 04-home-empty-state
