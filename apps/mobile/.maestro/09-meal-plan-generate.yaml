appId: com.dinnertime.app
name: "09 — meal plan: generate a 7-day plan and verify day rows render"
tags:
  - phase-19
# Pre-condition: UAT user is logged in, has no active meal plan (or any plan is fine).
# If a plan already exists, this flow verifies the existing plan renders.
# To force re-generation, use the Regenerate button.
#
# Phase 19 update: DayRow reshuffled to a denser layout (day label + thumbnail
# + meal name + status chips); generate/regenerate CTAs retinted terracotta
# (colors.brand). No selector changes — screenshot baselines re-captured.
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Plan tab
- tapOn:
    text: ".*Plan.*"

- takeScreenshot: 03-plan-tab

# Wait for the plan screen to be past the loading spinner.
# The screen shows "No plan yet" (empty) or "This Week" (has plan).
# The generate button and "This Week" heading both include "week" — wait for that.
- extendedWaitUntil:
    visible:
      text: ".*week.*"

    timeout: 15000
- takeScreenshot: 04-plan-state

# If no plan, generate one (AI-backed — generous timeout)
- tapOn:
    text: ".*Generate this week.*"

    optional: true
- takeScreenshot: 05-generating

# Wait for the plan to render (either "This Week" header or Mon-Sun day rows)
- extendedWaitUntil:
    visible:
      text: ".*This Week.*"

    timeout: 90000
- takeScreenshot: 06-plan-rendered

# Verify day labels appear (Mon–Sun are rendered as DAY_LABELS in DayRow)
- assertVisible:
    text: ".*Mon.*"

    optional: true
- assertVisible:
    text: ".*Tue.*"

    optional: true
- takeScreenshot: 07-day-rows-visible

# Verify Regenerate button is present (only present if plan generated successfully)
# If pantry is empty, EMPTY_PANTRY error is shown and no plan is generated.
- assertVisible:
    text: ".*Regenerate.*"
    optional: true
- takeScreenshot: 08-plan-complete
