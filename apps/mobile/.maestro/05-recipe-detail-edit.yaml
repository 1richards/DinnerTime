appId: com.dinnertime.app
name: "05 — recipe detail + edit: open first recipe, view detail, edit title, save"
# Pre-condition: at least one recipe must exist in the UAT user's library.
# Run the reset script then 03-import-url first if the library is empty.
#
# Phase 15 update: recipes/[id]/index now consolidates 3 secondary actions
# (Add to Plan / Remix / Delete) into a HeaderEllipsis overflow menu at the
# top-right of the floating hero overlay. Edit remains an inline full-width
# body CTA. The flow still taps ".*Edit.*" (unchanged). Save Changes still
# short-circuits the useDirtyFormGuard (touched=false after successful save).
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Kitchen tab → Recipe Box segment (renamed from "Library")
- tapOn:
    text: ".*Kitchen.*"
- tapOn:
    text: ".*Recipe Box.*"

- extendedWaitUntil:
    visible:
      text: ".*in your recipe box.*"

    timeout: 15000
- takeScreenshot: 03-recipes-list

# Tap first recipe card (dynamic content — use coordinates for first item).
# Post-polish: HeroImage banner + SuggestedForYou takes ~50% of screen height.
# First recipe card appears at ~65% Y on iPhone 17 Pro.
- tapOn:
    point: "50%,65%"
- takeScreenshot: 04-recipe-detail

# Verify we're on the detail screen by looking for the Ingredients heading
- extendedWaitUntil:
    visible:
      text: ".*Ingredients.*"

    timeout: 10000

# Scroll down to reveal Steps, Start Cooking, and Edit (below the fold post-polish)
- scroll

- assertVisible:
    text: ".*Steps.*"

- scroll

- assertVisible:
    text: ".*Start Cooking.*"

- assertVisible:
    text: ".*Edit.*"

- takeScreenshot: 05-detail-confirmed

# Tap Edit
- tapOn:
    text: ".*Edit.*"

- takeScreenshot: 06-edit-screen

# Edit screen has a "Recipe title" placeholder in the Title field
- extendedWaitUntil:
    visible:
      text: ".*Save Changes.*"

    timeout: 10000
- takeScreenshot: 07-edit-screen-loaded

# Clear the title field and type a new value
# The title field shows the current recipe title — clear it by selecting all
- tapOn:
    text: ".*Recipe title.*"

    optional: true
- tapOn:
    point: "50%,18%"
- eraseText: 50
- inputText: "UAT Edited Recipe"
- takeScreenshot: 08-title-edited

# Save
- tapOn:
    text: ".*Save Changes.*"

- takeScreenshot: 09-saving
# After save, we're back on the detail screen. Scroll position may be mid-page.
# Scroll to top to ensure Ingredients heading is in viewport, then assert.
- scrollUntilVisible:
    element:
      text: ".*Ingredients.*"
    direction: UP
    timeout: 15000
- takeScreenshot: 10-back-on-detail
