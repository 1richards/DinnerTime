appId: com.dinnertime.app
name: "40 — recipe detail: Share PDF action surfaces toast (or share sheet)"
---
- runFlow: _ensure-logged-in.yaml

# Tap "Recipe Box" segment to switch to saved recipes. Regex selector
# matches Pressable's accessibilityLabel (per flow 20).
- tapOn:
    text: ".*Recipe Box.*"
- assertVisible:
    text: ".*in your recipe box.*"
- takeScreenshot: 01-recipe-box

# Tap the first recipe card. Cards sit below the sticky search pill;
# y=45% lands on the first card on a 17 Pro screen.
- tapOn:
    point: "50%,45%"
- takeScreenshot: 02-preview-sheet

# Hero has TWO buttons in the top-right: close (X) and the new share
# button. Tap the share button via its accessibilityLabel.
- tapOn:
    text: "Share recipe as PDF"

# Wait for the iOS native share sheet animation to complete. The share
# sheet is a UIKit-presented controller, so it animates over ~400ms.
- waitForAnimationToEnd:
    timeout: 4000

- takeScreenshot: 03-after-share-tap

# Try to dismiss the share sheet so future runs land in a clean state.
- tapOn:
    text: "Cancel|Done|Close"
    optional: true
