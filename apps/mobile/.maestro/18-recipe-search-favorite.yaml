appId: com.dinnertime.app
name: "18 — recipe search + favorite: sticky pill modal + Favorites chip + heart toggle"
tags:
  - phase-19
# Pre-condition: at least one recipe must exist in the UAT user's library.
#
# Phase 19 update: the inline SearchBar and "Toggle search" action button
# are GONE. Search now lives in a StickySearchPill that taps out to the
# /search modal (Phase 17 will wire actual search results). For now the
# flow just verifies the pill -> modal -> dismiss round-trip works, then
# covers the Favorites chip + per-recipe heart toggle path.
#
# Phase 15 update: heart glyph migrated from Ionicons heart to SF heart.fill
# (active) / heart (inactive); Phase 19 retcon'd tint to terracotta
# (colors.brand). Favorite tap target is a Pressable with accessibilityLabel
# so coordinate taps at 88%,15% still work.
---
# Force a clean app restart — upstream flows can leave modals or sheets open
# that bleed into this flow's initial state.
- launchApp:
    clearState: true
- openLink: "exp+dinnertime://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: ".*Open.*"
    optional: true
- tapOn:
    text: ".*Continue.*"
    optional: true
- tapOn:
    point: "90%,32%"
    optional: true

- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Kitchen tab → Library segment (Phase 12 consolidation)
- tapOn:
    text: ".*Kitchen.*"
- tapOn:
    text: ".*Recipe Box.*"

# Wait for Library segment to load — "in your library" is the stable marker.
- extendedWaitUntil:
    visible:
      text: ".*in your recipe box.*"
    timeout: 15000
- takeScreenshot: 03-recipes-list

# Sticky search pill is present above the large-title header.
- assertVisible:
    text: "Search recipes"
- takeScreenshot: 04-sticky-pill-visible

# Tap pill -> /search modal. Modal shows a "Search" title + context echo.
- tapOn:
    text: "Search recipes"
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 10000
- takeScreenshot: 05-search-modal-open

# Dismiss the modal (swipe-down on modal presentation).
- swipe:
    start: "50%,10%"
    end: "50%,90%"
- extendedWaitUntil:
    visible:
      text: ".*in your recipe box.*"
    timeout: 10000
- takeScreenshot: 06-back-on-library

# Toggle "Favorites" chip to see favorite-only view (only visible with recipes)
- tapOn:
    text: ".*Favorites.*"
    optional: true
- takeScreenshot: 07-favorites-view

# Toggle back to all
- tapOn:
    text: ".*Favorites.*"
    optional: true
- takeScreenshot: 08-all-recipes

# Open the first recipe if one exists (coordinate tap — optional)
- tapOn:
    point: "50%,40%"
    optional: true
- takeScreenshot: 09-recipe-or-empty

# If on recipe detail, try to toggle favorite (heart in top-right of hero).
- tapOn:
    point: "88%,15%"
    optional: true
- takeScreenshot: 10-favorite-toggled

# Go back to recipe list if on detail screen
- tapOn:
    point: "5%,10%"
    optional: true
- takeScreenshot: 11-back-to-list
