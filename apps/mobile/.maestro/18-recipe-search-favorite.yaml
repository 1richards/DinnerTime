appId: com.dinnertime.app
name: "18 — recipe search + favorite: search recipes and toggle a favorite"
# Pre-condition: at least one recipe must exist in the UAT user's library.
#
# Phase 15 update: heart glyph migrated from Ionicons heart to SF heart.fill
# (active) / heart (inactive) with orange #F97316 tint on active — Phase 15
# baseline preserved. Favorite tap target is a Pressable with
# accessibilityLabel so coordinate taps at 88%,15% still work. Toggle search
# and Favorites chip selectors unchanged. Screenshot baselines will show SF
# Symbol renders but layout is identical.
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Kitchen tab → Library segment (Phase 12 consolidation)
- tapOn:
    text: ".*Kitchen.*"
- tapOn:
    text: ".*Library.*"

# Wait for Library segment to load — search bar placeholder is the stable post-merge marker
- extendedWaitUntil:
    visible:
      text: ".*in your library.*"
    timeout: 15000
- takeScreenshot: 03-recipes-list

# SearchBar is hidden by default on Library — tap the search toggle (top-right
# action button with "Toggle search" accessibility label) to reveal it.
- tapOn:
    text: ".*Toggle search.*"
    optional: true
- tapOn:
    text: ".*Search recipes.*"
    optional: true
- inputText: "egg"
- takeScreenshot: 04-search-active

# Results may be empty or filtered — take a screenshot regardless
- takeScreenshot: 05-search-results

# Clear the search text
- eraseText: 10
- takeScreenshot: 06-search-cleared

# Toggle "Favorites" chip to see favorite-only view (only visible with recipes)
- tapOn:
    text: ".*Favorites.*"
    optional: true
- takeScreenshot: 07-favorites-view

# Toggle back to all
- tapOn:
    text: ".*Favorites.*"
    optional: true
- takeScreenshot: 08-all-recipes

# Open the first recipe if one exists (coordinate tap — optional)
- tapOn:
    point: "50%,40%"
    optional: true
- takeScreenshot: 09-recipe-or-empty

# If on recipe detail, try to toggle favorite
- tapOn:
    point: "88%,15%"
    optional: true
- takeScreenshot: 10-favorite-toggled

# Go back to recipe list if on detail screen
- tapOn:
    point: "5%,10%"
    optional: true
- takeScreenshot: 11-back-to-list
