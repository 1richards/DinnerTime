appId: com.dinnertime.app
name: "07 — pantry: add item manually via scan button sheet"
# Phase 15 update: ScanButton FAB camera glyph swapped from Ionicons
# camera to SF Symbol camera.fill (orange container preserved, tint #FFFFFF).
# Empty-state "Scan Now" copy replaced by EmptyState primitive with food
# photography (EMPTY_STATE_IMAGES.emptyPantry). No text-selector changes —
# existing .*Fridge./.*Pantry./.*Freezer./.*All.* filter selectors still valid.
# NOTE: The Pantry tab's primary CTA on an empty pantry is "Scan Now" (camera).
# Since camera is not available in simulator, this flow tests the path where
# the user has at least one item (or we navigate directly to the pantry).
# The ScanButton FAB is always visible when items exist.
# When pantry is EMPTY, the only visible UI is "Scan Now" — there is no manual
# add form reachable from the empty state. If the pantry already has items,
# the ScanButton (FAB) is shown and could open the scan screen (camera — skip).
#
# WORKAROUND: Items are seeded via the test-user reset script + direct DB insert,
# OR this flow just verifies the pantry screen renders after login with items.
# The "add item manually" path visible in the shopping list's AddItemSheet is
# tested in flow 11 (shopping list add item) instead.
#
# This flow: login -> Pantry tab -> confirm UI renders -> filter tabs work.
---
- runFlow: _ensure-logged-in.yaml

- takeScreenshot: 02-home

# Navigate to Pantry tab
- tapOn:
    text: ".*Pantry.*"

- takeScreenshot: 03-pantry-tab

# Pantry can be empty (shows "Your kitchen is empty" with "Scan Now")
# or have items (shows "My Kitchen" with filter tabs).
# Wait up to 10s for any of the known screen states to appear.
- takeScreenshot: 04-pantry-state

# If My Kitchen header visible, test filter tabs
- tapOn:
    text: ".*Fridge.*"

    optional: true
- takeScreenshot: 05-fridge-filter
- tapOn:
    text: ".*Pantry.*"

    optional: true
- takeScreenshot: 06-pantry-filter
- tapOn:
    text: ".*Freezer.*"

    optional: true
- takeScreenshot: 07-freezer-filter
- tapOn:
    text: ".*All.*"

    optional: true
- takeScreenshot: 08-all-items
