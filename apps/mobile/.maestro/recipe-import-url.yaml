appId: com.dinnertime.app
name: recipe import — paste a URL and verify the recipe is saved
env:
  RECIPE_URL: "https://www.allrecipes.com/recipe/213742/cheesy-chicken-broccoli-casserole/"
---
- launchApp:
    clearState: false
# Assumes user is already logged in and onboarded.
- assertVisible:
    text: "onboarded=true"
- tapOn: "Recipes"
- takeScreenshot: 01-recipes-tab
- tapOn:
    text: "Import"
    optional: true
- tapOn:
    text: "URL"
    optional: true
- tapOn: "Paste a recipe URL"
- inputText: ${RECIPE_URL}
- tapOn: "Import"
- takeScreenshot: 02-import-pending
# Either success card or error toast — capture both for diagnosis.
- extendedWaitUntil:
    visible:
      text: "Cheesy"
    timeout: 30000
    optional: true
- takeScreenshot: 03-import-result
