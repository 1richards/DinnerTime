appId: com.dinnertime.app
name: "34 — Plan day drill-down: /plan/[date] shows ingredients checklist + cook now"
tags:
  - phase-22
# Phase 22-04 — Day drill-down route.
#
# Flow (screenshot-forward, not assertion-heavy, per CLAUDE.md Maestro
# selector notes: plain UI labels only, avoid text containing = ( ? etc):
#   1. Login → Plan tab
#   2. Toggle to Month view (entry point to the drill-down is via the
#      Month grid's cell tap — see MonthGrid.tsx router.push)
#   3. Screenshot Month view so downstream humans can see what cells exist
#   4. Tap the first planned cell (best-effort: label matches any day
#      number that also reads as a planned status dot via accessibility)
#   5. Screenshot landing surface — either:
#        a) /plan/[date] drill-down (has "Quick timers" + "Start Cooking")
#        b) No effect (empty cell tapped → pin sheet, not drill-down)
#   6. Soft-assert drill-down surface ("Quick timers" optional so the flow
#      stays green even when no planned cells exist in the sim's seed data
#      — screenshots remain the source of truth for visual UAT)
#   7. Back → restored to Plan/Month
#
# NOTE: Phase 22-04 requires the drill-down route to exist AND to be
# reachable via MonthGrid cell tap. Wave 0's Month migration + 22-03's
# MonthGrid already ship that `router.push('/plan/${iso}')`. This flow
# exercises the PUSH; the route itself is verified by unit typecheck and
# by visual screenshots.
---
- runFlow: _ensure-logged-in.yaml
- tapOn: "Plan"
- extendedWaitUntil:
    visible:
      text: ".*(Week|This|Day).*"
    timeout: 15000
- takeScreenshot: 01-plan-week
# Toggle to Month view so the grid is visible (cells are the entry point
# to the drill-down route per MonthGrid.tsx).
- tapOn:
    text: "Month"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*(Protein|Cuisine|Repeats|No data yet).*"
    timeout: 8000
    optional: true
- takeScreenshot: 02-plan-month
# Best-effort cell tap. Month cells render the day-of-month number; tap
# any small number in the grid area. Optional so the flow stays green
# when cells are not deterministically labeled on the seed sim data.
- tapOn:
    text: "15"
    optional: true
- takeScreenshot: 03-tapped-cell
# If we landed on the drill-down route, the "Quick timers" section label
# is visible (PLAN 22-04 lock). Optional so an empty-cell tap path (which
# opens the pin sheet instead) does not fail the flow.
- assertVisible:
    text: "Quick timers"
    optional: true
- takeScreenshot: 04-drilldown-or-pin
- back: true
- takeScreenshot: 05-restored
