appId: com.dinnertime.app
name: pantry — add an item by hand and verify it appears
---
- launchApp:
    clearState: false
- assertVisible:
    text: "onboarded=true"
- tapOn: "Pantry"
- takeScreenshot: 01-pantry-empty-or-list
- tapOn:
    text: "Add"
    optional: true
- tapOn: "Item name"
- inputText: "Maestro Test Tomato"
- tapOn:
    text: "Save"
- assertVisible: "Maestro Test Tomato"
- takeScreenshot: 02-item-added
