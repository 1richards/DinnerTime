appId: com.dinnertime.app
name: meal plan — generate a week and verify days populate
---
- launchApp:
    clearState: false
- assertVisible:
    text: "onboarded=true"
- tapOn: "Plan"
- takeScreenshot: 01-plan-tab
- tapOn:
    text: "Generate"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Monday"
    timeout: 60000
- takeScreenshot: 02-plan-generated
