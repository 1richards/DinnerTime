appId: com.dinnertime.app
name: onboarding — fresh user completes the wizard
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
  DISPLAY_NAME: "Maestro Tester"
---
- launchApp:
    clearState: true
- assertVisible:
    text: "loading=false"
- tapOn: "Sign Up"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn:
    text: "Create"
    optional: true
- tapOn:
    text: "Sign Up"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Welcome to DinnerTime"
    timeout: 15000
- takeScreenshot: 01-step-name
- tapOn: "Your name"
- inputText: ${DISPLAY_NAME}
- tapOn: "Next"
- takeScreenshot: 02-step-household
- tapOn: "Next"
- takeScreenshot: 03-step-prefs
- tapOn: "Italian"
- tapOn: "Mexican"
- tapOn: "Get Started"
- extendedWaitUntil:
    visible:
      text: "onboarded=true"
    timeout: 30000
- takeScreenshot: 04-onboarded
